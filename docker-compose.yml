version: '3.8'

networks:
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:

services:

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    networks:
      - backend-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_db.sh:/docker-entrypoint-initdb.d/init.sh
      - ./database/command.sql:/docker-entrypoint-initdb.d/schemas/command.sql
      - ./database/request.sql:/docker-entrypoint-initdb.d/schemas/request.sql
      - ./database/manager.sql:/docker-entrypoint-initdb.d/schemas/manager.sql
      - ./database/client.sql:/docker-entrypoint-initdb.d/schemas/client.sql
    mem_limit: 384m
    restart: always
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c max_connections=40
      -c effective_cache_size=384MB
      -c maintenance_work_mem=32MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    command: mongod --wiredTigerCacheSizeGB 0.25
    networks:
      - backend-net
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
      - ./init-scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    mem_limit: 384m
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-app:
    image: redis:7-alpine
    container_name: redis-app
    networks:
      - backend-net
    ports:
      - "6379:6379"
    mem_limit: 128m
    restart: always
    command: redis-server --maxmemory 100mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    networks:
      - backend-net
    ports:
      - "5672:5672"     
      - "15672:15672"   
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark relative 0.6"
    mem_limit: 512m
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-client:
    container_name: ms-client
    build:
      context: ./backend/ms-client
      dockerfile: Dockerfile
    networks:
      - backend-net
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/client_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS}
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 384m
    restart: always

  ms-auth:
    container_name: ms-auth
    build:
      context: ./backend/ms-auth
      dockerfile: Dockerfile
    networks:
      - backend-net
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k"
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      SPRING_DATA_REDIS_HOST: redis-app
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 384m
    restart: always

  ms-account:
    container_name: ms-account
    build:
      context: ./backend/ms-account
      dockerfile: Dockerfile
    networks:
      - backend-net
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k"
      SERVER_PORT: 8083
      SPRING_DATASOURCE_COMMAND_URL: jdbc:postgresql://postgres-db:5432/command_db
      SPRING_DATASOURCE_REQUEST_URL: jdbc:postgresql://postgres-db:5432/request_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres-db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis-app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 384m
    restart: always

  ms-manager:
    container_name: ms-manager
    build:
      context: ./backend/ms-manager
      dockerfile: Dockerfile
    networks:
      - backend-net
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/manager_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASS}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 384m
    restart: always

  ms-email:
    container_name: ms-email
    build:
      context: ./backend/ms-email
      dockerfile: Dockerfile
    networks:
      - backend-net
    ports:
      - "8086:8086"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 384m
    restart: always

  api-gateway:
    container_name: api-gateway
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    networks:
      - backend-net
    environment: 
      SPRING_DATA_REDIS_HOST: redis-app
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    command: node --max-old-space-size=192 server.js
    ports:
      - "3000:3000"
    depends_on:
      - redis-app
      - rabbitmq
      - ms-auth
    mem_limit: 256m
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  front:
    container_name: front
    build:
      context: ./front
      dockerfile: Dockerfile
    networks:
      - backend-net
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    mem_limit: 64m
    restart: always
